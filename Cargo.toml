[package]
name = "ugreen-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Unofficial local Bluetooth controller for UGREEN Studio Pro headphones"
license = "MIT"

[lib]
name = "ugreen_cli"
path = "src/lib.rs"

[[bin]]
name = "ugreen"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
ratatui = { version = "=0.30.2", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
